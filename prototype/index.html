<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111310" />
    <meta
      name="description"
      content="Devloop, le point de rencontre de ceux qui construisent. Partage du code, découvre des projets et trouve ton prochain binôme."
    />
    <title>devloop — Moins de bruit. Plus de code.</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <svg
      class="svg-definitions"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <symbol id="i-logo" viewBox="0 0 32 28">
        <path d="m10 5-8 9 8 9M22 5l8 9-8 9M19 2l-6 24" />
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1.6" />
        <rect x="14" y="3" width="7" height="7" rx="1.6" />
        <rect x="3" y="14" width="7" height="7" rx="1.6" />
        <rect x="14" y="14" width="7" height="7" rx="1.6" />
      </symbol>
      <symbol id="i-compass" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="m16 8-2.6 5.4L8 16l2.6-5.4L16 8Z" />
      </symbol>
      <symbol id="i-layers" viewBox="0 0 24 24">
        <path d="m12 3 10 5-10 5L2 8l10-5ZM2 12l10 5 10-5M2 16l10 5 10-5" />
      </symbol>
      <symbol id="i-users" viewBox="0 0 24 24">
        <path
          d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.87"
        />
        <circle cx="9" cy="7" r="4" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24">
        <path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14m-6-6 6 6-6 6" />
      </symbol>
      <symbol id="i-arrow-up-right" viewBox="0 0 24 24">
        <path d="M7 17 17 7M7 7h10v10" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="7" />
        <path d="m16 16 5 5" />
      </symbol>
      <symbol id="i-message" viewBox="0 0 24 24">
        <path
          d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"
        />
      </symbol>
      <symbol id="i-bell" viewBox="0 0 24 24">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
      </symbol>
      <symbol id="i-code" viewBox="0 0 24 24">
        <path d="m8 5-7 7 7 7m8-14 7 7-7 7M14 3l-4 18" />
      </symbol>
      <symbol id="i-image" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="3" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <path d="m21 15-5-5L5 21" />
      </symbol>
      <symbol id="i-help" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4M12 17h.01" />
      </symbol>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path
          d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"
        />
      </symbol>
      <symbol id="i-comment" viewBox="0 0 24 24">
        <path
          d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5H4l1.5-4A8.5 8.5 0 1 1 21 11.5Z"
        />
      </symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24">
        <path
          d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4m14-1v3a2 2 0 0 1-2 2H3"
        />
      </symbol>
      <symbol id="i-share" viewBox="0 0 24 24">
        <path d="M12 16V3m-5 5 5-5 5 5M5 13H3v8h18v-8h-2" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1" />
        <circle cx="12" cy="12" r="1" />
        <circle cx="19" cy="12" r="1" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="13" height="13" rx="2" />
        <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="m8 4 12 8-12 8V4Z" />
      </symbol>
      <symbol id="i-github" viewBox="0 0 24 24">
        <path
          d="M9 19c-4.3 1.3-4.3-2.2-6-2.7M15 22v-3.4a3 3 0 0 0-.8-2.3c2.7-.3 5.5-1.3 5.5-6A4.7 4.7 0 0 0 18.4 7a4.3 4.3 0 0 0-.1-3.3S17.3 3.4 15 5a11.4 11.4 0 0 0-6 0C6.7 3.4 5.7 3.7 5.7 3.7A4.3 4.3 0 0 0 5.6 7a4.7 4.7 0 0 0-1.3 3.3c0 4.7 2.8 5.7 5.5 6a3 3 0 0 0-.8 2.3V22"
        />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path
          d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 1 3h4l1-3 3-1 2-3-2-2 1-3-3-2-1-3H9Z"
          transform="translate(1 0)"
        />
        <circle cx="12" cy="11.5" r="3" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M6 18 18 6" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </symbol>
      <symbol id="i-trend" viewBox="0 0 24 24">
        <path d="m3 17 6-6 4 4 8-10m-6 0h6v6" />
      </symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24">
        <path d="m13 2-10 12h8l-1 8L21 9h-8V2Z" />
      </symbol>
      <symbol id="i-star" viewBox="0 0 24 24">
        <path
          d="m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.3L12 17.5l-5.7 3 1.1-6.3L2.8 9.7l6.4-.9L12 3Z"
        />
      </symbol>
      <symbol id="i-branch" viewBox="0 0 24 24">
        <circle cx="6" cy="5" r="3" />
        <circle cx="18" cy="6" r="3" />
        <circle cx="6" cy="19" r="3" />
        <path d="M6 8v8M9 16c6 0 9-2 9-7" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path d="m22 2-7 20-4-9-9-4L22 2ZM11 13 22 2" />
      </symbol>
      <symbol id="i-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <ellipse cx="12" cy="12" rx="4" ry="9" />
        <path d="M3 12h18" />
      </symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="3" />
        <path d="m6 9 3 3-3 3m7 0h5" />
      </symbol>
      <symbol id="i-flag" viewBox="0 0 24 24">
        <path d="M4 22V3c5-4 10 4 16 0v11c-6 4-11-4-16 0" />
      </symbol>
      <symbol id="i-filter" viewBox="0 0 24 24">
        <path d="M4 7h16M7 12h10M10 17h4" />
      </symbol>
      <symbol id="i-rocket" viewBox="0 0 24 24">
        <path
          d="M12 15 9 12c2-6 6-9 12-9 0 6-3 10-9 12ZM9 12H4l-2 4 5 1m5-2v5l-4 2-1-5M5 19l-2 2"
        />
        <circle cx="16" cy="8" r="1.5" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10" width="14" height="11" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
      </symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Navigation principale">
        <a href="#" class="brand" data-nav="feed" aria-label="devloop, accueil"
          ><svg class="brand-symbol"><use href="#i-logo" /></svg
          ><span>devloop<span class="brand-dot">.</span></span
          ><span class="beta-badge">BÊTA</span></a
        >
        <div class="sidebar-content">
          <p class="nav-caption">LA COMMUNAUTÉ</p>
          <nav class="main-nav">
            <button
              class="nav-link active"
              data-nav="feed"
              aria-label="Le fil"
              title="Le fil"
            >
              <svg class="icon"><use href="#i-home" /></svg><span>Le fil</span
              ><i class="nav-dot"></i>
            </button>
            <button
              class="nav-link"
              data-nav="explore"
              aria-label="Explorer"
              title="Explorer"
            >
              <svg class="icon"><use href="#i-compass" /></svg
              ><span>Explorer</span>
            </button>
            <button
              class="nav-link"
              data-nav="projects"
              aria-label="Les projets"
              title="Les projets"
            >
              <svg class="icon"><use href="#i-layers" /></svg
              ><span>Les projets</span><span class="nav-new">NEW</span>
            </button>
            <button
              class="nav-link"
              data-nav="help"
              aria-label="Entraide"
              title="Entraide"
            >
              <svg class="icon"><use href="#i-users" /></svg
              ><span>Entraide</span><span class="nav-counter">8</span>
            </button>
            <button
              class="nav-link"
              data-nav="saved"
              aria-label="Mes favoris"
              title="Mes favoris"
            >
              <svg class="icon"><use href="#i-bookmark" /></svg
              ><span>Mes favoris</span
              ><span class="nav-counter" id="savedCount">1</span>
            </button>
          </nav>
          <div class="spaces-heading">
            <p class="nav-caption">MES COMMUNAUTÉS</p>
            <button
              class="icon-btn small"
              data-action="communities"
              aria-label="Découvrir les communautés"
            >
              <svg class="icon"><use href="#i-plus" /></svg>
            </button>
          </div>
          <nav class="space-nav" aria-label="Mes communautés">
            <button class="space-link" data-community="javascript">
              <span class="space-hash yellow">#</span><span>javascript</span
              ><span class="space-dot"></span>
            </button>
            <button class="space-link" data-community="react">
              <span class="space-hash blue">#</span><span>react</span>
            </button>
            <button class="space-link" data-community="build-in-public">
              <span class="space-hash purple">#</span
              ><span>build-in-public</span><span class="space-count">12</span>
            </button>
            <button class="discover-link" data-action="communities">
              <svg class="icon"><use href="#i-plus" /></svg
              ><span>Découvrir des communautés</span>
            </button>
          </nav>
          <div class="sidebar-online">
            <span class="online-indicator"></span
            ><span><strong>128</strong> devs dans la boucle</span>
          </div>
        </div>
        <div class="sidebar-bottom">
          <div class="opensource-note">
            <div class="opensource-icon">
              <svg class="icon"><use href="#i-github" /></svg>
            </div>
            <p>Par les devs.<br /><strong>Pour les devs.</strong></p>
            <button
              class="icon-btn"
              data-action="about"
              aria-label="À propos de devloop"
            >
              <svg class="icon"><use href="#i-arrow-up-right" /></svg></button
            ><span class="opensource-foot"
              >Le partage fait partie du code.</span
            >
          </div>
          <button class="account-button" data-action="my-profile">
            <span class="avatar-wrap"
              ><img class="avatar" src="assets/alex.jpg" alt="" /><span
                class="avatar-online"
              ></span></span
            ><span class="account-copy"
              ><strong id="accountName">Alex Morgan</strong
              ><span>Mon espace personnel</span></span
            ><svg class="icon account-settings"><use href="#i-settings" /></svg>
          </button>
        </div>
      </aside>
      <button
        class="mobile-shade"
        id="mobileShade"
        aria-label="Fermer la navigation"
        data-action="toggle-sidebar"
      ></button>
      <div class="workspace">
        <header class="topbar">
          <div class="header-left">
            <button
              class="icon-btn mobile-menu"
              aria-expanded="false"
              aria-controls="sidebar"
              data-action="toggle-sidebar"
              aria-label="Ouvrir la navigation"
            >
              <svg class="icon"><use href="#i-menu" /></svg>
            </button>
            <div class="breadcrumb">
              <span>Communauté</span><span class="breadcrumb-slash">/</span
              ><strong id="breadcrumbCurrent">Le fil</strong>
            </div>
          </div>
          <div class="topbar-actions">
            <button class="search-trigger" data-action="search">
              <svg class="icon"><use href="#i-search" /></svg
              ><span>Rechercher dans la boucle...</span><kbd>⌘ K</kbd>
            </button>
            <div class="topbar-divider"></div>
            <button
              class="icon-btn header-icon"
              data-action="messages"
              aria-label="Ouvrir les messages"
            >
              <svg class="icon"><use href="#i-message" /></svg>
            </button>
            <div class="notification-anchor">
              <button
                class="icon-btn header-icon notification-trigger"
                data-action="notifications"
                aria-label="Notifications"
              >
                <svg class="icon"><use href="#i-bell" /></svg
                ><span class="notification-dot" id="notificationDot"></span>
              </button>
              <div
                class="notification-popover"
                id="notificationPopover"
                hidden
              ></div>
            </div>
            <button
              class="topbar-profile"
              data-action="my-profile"
              aria-label="Ouvrir mon profil"
            >
              <img class="avatar" src="assets/alex.jpg" alt="Votre profil" />
            </button>
          </div>
        </header>
        <main id="mainContent" tabindex="-1"></main>
      </div>
    </div>
    <div id="overlayRoot"></div>
    <div
      id="toastStack"
      class="toast-stack"
      role="status"
      aria-live="polite"
    ></div>
  </body>
</html>
